[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dynamic-background"
version = "1.0.0"
description = "Extract and schedule dynamic wallpaper cycles"
readme = "README.md"
package-mode = true
packages = [{include = "dynamic_background", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pillow = "12.2.0"
pillow-heif = "1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
ruff = "0.15.20"

[tool.poetry.scripts]
dynamic-background = "dynamic_background.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["env", ".venv", "build", "dist", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["B904", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["dynamic_background"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
